name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Refresh the project list daily so new public repos appear without a commit.
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - run: npm ci

      - name: Sync projects from the GitHub API
        run: npm run sync
        env:
          # Lifts the anonymous rate limit; only needs public repo read access.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: npm run build
        env:
          # e.g. "/portfolio/" for a project site, "/" for a user or custom-domain site.
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Add SPA fallback
        # GitHub Pages has no server-side rewrites, so a deep link like
        # /projects 404s. Serving index.html as the 404 page lets vue-router
        # take over and render the right view.
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
