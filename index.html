<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="%BASE_URL%favicon.ico" sizes="any" />
    <title>Cameron Wragg — Software Engineer</title>
    <meta
      name="description"
      content="Portfolio of Cameron Wragg, a software engineer building for servers, desktops and very small computers."
    />
    <meta name="theme-color" content="#0e121a" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Cameron Wragg — Software Engineer" />
    <meta
      property="og:description"
      content="Portfolio of Cameron Wragg, a software engineer building for servers, desktops and very small computers."
    />
    <meta name="twitter:card" content="summary" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <script>
      // Applied before first paint so the page never flashes the wrong theme.
      try {
        const stored = localStorage.getItem('theme')
        const dark = stored ? stored === 'dark' : !window.matchMedia('(prefers-color-scheme: light)').matches
        document.documentElement.classList.toggle('dark', dark)
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
